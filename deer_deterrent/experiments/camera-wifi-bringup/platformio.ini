[platformio]
default_envs = adafruit_feather_esp32s3_tft

[env:adafruit_feather_esp32s3_tft]
platform = espressif32@7.1.0
board = adafruit_feather_esp32s3_tft
framework = arduino
monitor_speed = 115200
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@1.12.0
    adafruit/Adafruit GFX Library@1.13.0
