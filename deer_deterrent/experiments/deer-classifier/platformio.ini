[platformio]
core_dir = V:/.platformio
packages_dir = V:/.platformio/packages
build_dir = .pio/build-native
[env:classifier_test]
platform = espressif32@6.10.0
board = adafruit_feather_esp32s3_tft
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no



platform_packages =
    platformio/tool-cmake@~3.30.0

    platformio/framework-espidf@3.50402.0
