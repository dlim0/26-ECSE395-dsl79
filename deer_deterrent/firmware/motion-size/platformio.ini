[platformio]
default_envs = vibration_fusion
core_dir = V:/.platformio
packages_dir = V:/.platformio/packages
build_dir = .pio/build-native
[env:classifier_test]
platform = espressif32@6.10.0
board = adafruit_feather_esp32s3_tft
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no



platform_packages =
    platformio/tool-cmake@~3.30.0

    platformio/framework-espidf@3.50402.0

[env:camera_diagnostic]
extends = env:classifier_test
build_flags = -DCAMERA_DIAGNOSTIC=1

[env:pir_diagnostic]
extends = env:classifier_test
build_flags = -DPIR_DIAGNOSTIC=1

[env:pir_camera_bench]
extends = env:pir_diagnostic
build_flags = ${env:pir_diagnostic.build_flags} -DPIR_CAMERA_BENCH=1

[env:vibration_receiver]
extends = env:classifier_test
build_flags = -DVIBRATION_WIFI=1 -DVIBRATION_VERIFY=1

[env:vibration_fusion]
extends = env:classifier_test
build_flags = -DVIBRATION_WIFI=1


[env:pir_wifi_camera_test]
extends = env:classifier_test
build_flags = -DVIBRATION_WIFI=1 -DPIR_WIFI_CAMERA_TEST=1
