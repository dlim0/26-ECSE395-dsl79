; CHANGED: Build one lab program per environment.
[platformio]
default_envs = servo_random

[env]
platform = espressif32
board = adafruit_feather_esp32_v2
framework = arduino
lib_deps = madhephaestus/ESP32Servo@^3.1.3
monitor_speed = 115200
; Connected ESP32 USB serial port (update if Windows assigns a new port).
upload_port = COM3
monitor_port = COM3

[env:tt_basic]
build_src_filter = -<*> +<TT Motor.cpp>

[env:tt_rotate]
build_src_filter = -<*> +<TT Motor Rotate.cpp>

[env:servo_sweep]
build_src_filter = -<*> +<Servo Motor.cpp>

[env:servo_random]
build_src_filter = -<*> +<Servo Motor Random.cpp>
